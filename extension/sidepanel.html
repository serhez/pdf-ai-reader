<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF AI Reader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <div>
          <p class="eyebrow">PDF AI Reader</p>
          <h1 id="action-title">Select text in a local PDF or Peek preview</h1>
        </div>
        <button id="open-options" class="icon-button" type="button" aria-label="Open settings" title="Settings">&#9881;</button>
      </header>

      <p id="status" class="status" data-kind="idle">Ready</p>
      <p id="location" class="location" hidden></p>

      <section id="selection-section" hidden>
        <h2>Selection</h2>
        <blockquote id="selection"></blockquote>
      </section>

      <section id="result-section" hidden>
        <h2 id="result-title">Result</h2>
        <pre id="result"></pre>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
